<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalo Especial</title>
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <style>
        :root {
            --primary-color: #ff4c4c;
            --secondary-color: #ffd54f;
            --glow-color: #ffe066;
            --background-color: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(180deg, var(--background-color), #1a1a1a);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
            padding: 1rem;
        }

        .gift-container {
            perspective: 1500px;
            position: relative;
            max-width: 100%;
        }

        .gift-box {
            width: min(280px, 80vw);
            height: min(280px, 80vw);
            background: linear-gradient(145deg, var(--primary-color), #ff8c8c);
            border-radius: 24px;
            position: relative;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                0 -8px 30px rgba(255, 200, 200, 0.4) inset,
                0 0 20px rgba(255, 100, 100, 0.3);
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 2;
        }

        .gift-box:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .gift-lid {
            width: 100%;
            height: 60px;
            background: linear-gradient(145deg, #ff7b7b, #ff4c6c);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.6) inset,
                0 4px 10px rgba(255, 100, 100, 0.3);
            z-index: 3;
        }

        .ribbon-vertical {
            position: absolute;
            top: 0;
            left: calc(50% - 15px);
            width: 30px;
            height: 100%;
            background: linear-gradient(180deg, var(--secondary-color), #ffcc33);
            border-radius: 8px;
            box-shadow: 
                0 0 12px rgba(255, 215, 0, 0.6) inset,
                0 0 8px rgba(255, 215, 0, 0.4);
            z-index: 4;
        }

        .ribbon-horizontal {
            position: absolute;
            top: calc(50% - 25px);
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg, var(--secondary-color), #ffcc33);
            border-radius: 8px;
            box-shadow: 
                0 0 12px rgba(255, 215, 0, 0.6) inset,
                0 0 8px rgba(255, 215, 0, 0.4);
            z-index: 4;
        }

        .bow {
            position: absolute;
            top: calc(50% - 40px);
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 70px;
            z-index: 5;
        }

        .bow::before,
        .bow::after {
            content: '';
            position: absolute;
            width: 45px;
            height: 70px;
            background: linear-gradient(145deg, var(--glow-color), #fff9a6);
            border-radius: 50% 50% 20% 20%;
            top: 0;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.7),
                0 0 8px rgba(255, 215, 0, 0.5) inset;
            transition: transform 0.3s ease;
        }

        .bow::before {
            left: 0;
            transform: rotate(-45deg);
        }

        .bow::after {
            right: 0;
            transform: rotate(45deg);
        }

        .gift-box:hover .bow::before {
            transform: rotate(-50deg);
        }

        .gift-box:hover .bow::after {
            transform: rotate(50deg);
        }

        .message {
            margin-top: 2rem;
            text-align: center;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            animation: fadeIn 1.8s ease-out forwards;
            max-width: 90%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #ffd700, #fff59d, transparent);
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) scale(0.5);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-300px) translateX(50px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translateY(-600px) translateX(-50px) scale(0.2);
                opacity: 0;
            }
        }

        .opened .gift-lid {
            transform: rotateX(-140deg);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .gift-box {
                width: min(220px, 90vw);
                height: min(220px, 90vw);
            }

            .gift-lid {
                height: 50px;
            }

            .ribbon-vertical {
                width: 24px;
                left: calc(50% - 12px);
            }

            .ribbon-horizontal {
                height: 40px;
                top: calc(50% - 20px);
            }

            .bow {
                width: 70px;
                height: 50px;
                top: calc(50% - 25px);
            }

            .bow::before,
            .bow::after {
                width: 35px;
                height: 50px;
            }
        }

        /* High-resolution displays */
        @media (min-resolution: 2dppx) {
            .gift-box, .gift-lid, .ribbon-vertical, .ribbon-horizontal, .bow::before, .bow::after {
                filter: brightness(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="gift-container">
        <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>
            <div class="ribbon-vertical"></div>
            <div class="ribbon-horizontal"></div>
            <div class="bow"></div>
        </div>
    </div>
    <div class="message" id="message">
        ¡Te traigo un regalo especial para ti! ❤️
    </div>
    <script>
        const giftBox = document.getElementById('giftBox');

        function createParticles(count = 20, burst = false) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = burst 
                    ? `${giftBox.getBoundingClientRect().left + Math.random() * giftBox.offsetWidth}px`
                    : `${Math.random() * window.innerWidth}px`;
                particle.style.top = burst 
                    ? `${giftBox.getBoundingClientRect().top}px`
                    : `${Math.random() * window.innerHeight}px`;
                const size = 3 + Math.random() * 6;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.animationDuration = `${2 + Math.random() * 3}s`;
                particle.style.animationDelay = `${Math.random() * 2}s`;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 6000);
            }
        }

        setInterval(() => createParticles(15), 300);

        giftBox.addEventListener('click', () => {
            giftBox.classList.add('opened');
            createParticles(60, true);
            setTimeout(() => {
                window.location.href = "flower.html";
            }, 3500);
        });

        // Touch support for mobile
        giftBox.addEventListener('touchstart', (e) => {
            e.preventDefault();
            giftBox.classList.add('opened');
            createParticles(60, true);
            setTimeout(() => {
                window.location.href = "flower.html";
            }, 3500);
        });

        // Prevent multiple rapid clicks
        let isClicked = false;
        giftBox.addEventListener('click', () => {
            if (isClicked) return;
            isClicked = true;
            setTimeout(() => isClicked = false, 4000);
        });
    </script>
</body>
</html>
